<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ucompiler — Interactive C IDE</title>
<style>
/* ---------- Design tokens (standalone build) ---------- */
:root{
  --kimi-color-text-primary:#1a1a1a;
  --kimi-color-text-secondary:#4d4d4d;
  --kimi-color-text-tertiary:#8a8a8a;
  --kimi-color-text-quaternary:#bfbfbf;
  --kimi-color-surface:#ffffff;
  --kimi-color-surface-muted:#f6f6f6;
  --kimi-color-surface-raised:#ffffff;
  --kimi-color-border:#e5e5e5;
  --kimi-color-positive:#2e9e5b;
  --kimi-chart-3:#3aa76d;
  --kimi-chart-4:#8b5cf6;
  --kimi-font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --kimi-font-mono:"SF Mono",SFMono-Regular,ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
  --t-fast:120ms;
  --ease-out:cubic-bezier(.2,.8,.4,1);
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--kimi-font-sans);
  background:#ececec;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  color:var(--kimi-color-text-primary);
}
button{font:inherit}

/* ---------- App frame ---------- */
.uc-app{
  width:100%;max-width:1080px;
  border:1px solid var(--kimi-color-border);
  border-radius:12px;
  overflow:hidden;
  background:var(--kimi-color-surface-raised);
  box-shadow:0 8px 30px rgba(0,0,0,.06);
}

/* ---------- Top bar ---------- */
.uc-bar{display:flex;align-items:center;gap:10px;height:52px;padding:0 12px;border-bottom:1px solid var(--kimi-color-border)}
.uc-logo{width:30px;height:30px;border-radius:8px;background:var(--kimi-color-text-primary);color:var(--kimi-color-surface);display:flex;align-items:center;justify-content:center;flex:none}
.uc-wordmark{font-size:15px;font-weight:500;letter-spacing:0}
.uc-vdiv{width:1px;height:16px;background:var(--kimi-color-border)}
.uc-crumb{font-size:12px;color:var(--kimi-color-text-tertiary)}
.uc-crumb b{color:var(--kimi-color-text-secondary);font-weight:400}
.uc-spacer{flex:1}
.uc-icobtn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:0;background:transparent;color:var(--kimi-color-text-tertiary);cursor:pointer;transition:background var(--t-fast) var(--ease-out),color var(--t-fast)}
.uc-icobtn:hover{background:var(--kimi-color-surface-muted);color:var(--kimi-color-text-primary)}
.uc-avatar{width:28px;height:28px;border-radius:8px;background:var(--kimi-color-surface-muted);border:1px solid var(--kimi-color-border);color:var(--kimi-color-text-secondary);font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center}
.uc-username{font-size:13px;color:var(--kimi-color-text-secondary)}
.uc-run{display:flex;align-items:center;gap:6px;height:32px;padding:0 14px;border:0;border-radius:8px;background:var(--kimi-color-text-primary);color:var(--kimi-color-surface);font-size:14px;font-weight:500;cursor:pointer;transition:opacity var(--t-fast)}
.uc-run:disabled{opacity:.45;cursor:default}
.uc-user{display:flex;align-items:center;gap:8px}

/* ---------- Tabs ---------- */
.uc-tabs{display:flex;align-items:stretch;height:36px;padding:0 8px;gap:2px;border-bottom:1px solid var(--kimi-color-border)}
.uc-tab{display:flex;align-items:center;gap:6px;padding:0 12px;font-size:13px;color:var(--kimi-color-text-tertiary);border-bottom:2px solid transparent;cursor:pointer;user-select:none}
.uc-tab:hover{color:var(--kimi-color-text-secondary)}
.uc-tab.on{color:var(--kimi-color-text-primary);border-bottom-color:var(--kimi-color-text-primary);font-weight:500}
.uc-tab-close{opacity:.45;display:flex}
.uc-tab-close:hover{opacity:1}
.uc-add{align-self:center}

/* ---------- Panes ---------- */
.uc-panes{display:grid;grid-template-columns:3fr 2fr;min-height:260px}
.uc-ed{display:flex;font-family:var(--kimi-font-mono);font-size:13px;line-height:22px;padding:12px 0}
.uc-gut{width:44px;flex:none;text-align:right;padding-right:12px;color:var(--kimi-color-text-quaternary);user-select:none}
.uc-code{flex:1;padding:0 16px;white-space:pre;color:var(--kimi-color-text-secondary);overflow-x:auto}
.tok-pre{color:var(--kimi-color-text-tertiary)}
.tok-inc{color:var(--kimi-color-text-quaternary)}
.tok-kw{color:var(--kimi-color-text-primary);font-weight:500}
.tok-fn{color:var(--kimi-color-text-primary)}
.tok-str{color:var(--kimi-chart-3)}
.tok-num{color:var(--kimi-chart-4)}

.uc-term{border-left:1px solid var(--kimi-color-border);display:flex;flex-direction:column}
.uc-th{display:flex;align-items:center;gap:8px;padding:0 12px;height:36px;border-bottom:1px solid var(--kimi-color-border);color:var(--kimi-color-text-tertiary)}
.uc-th-title{font-size:12px;font-weight:500;color:var(--kimi-color-text-primary)}
.uc-dot{width:7px;height:7px;border-radius:50%;background:var(--kimi-color-positive)}
.uc-th-status{font-size:12px;color:var(--kimi-color-text-tertiary)}
.uc-tb{flex:1;background:var(--kimi-color-surface-muted);padding:12px 16px;font-family:var(--kimi-font-mono);font-size:13px;line-height:22px}
.uc-tl{white-space:pre-wrap;word-break:break-all}
.uc-tl.dim{color:var(--kimi-color-text-quaternary)}
.uc-prompt{color:var(--kimi-color-text-quaternary)}
.uc-cmd{color:var(--kimi-color-text-primary)}
.uc-chip{margin-top:8px;display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-size:11px;font-family:var(--kimi-font-sans);color:var(--kimi-color-positive);background:rgba(46,158,91,.12)}

/* ---------- Status bar ---------- */
.uc-stat{display:flex;align-items:center;justify-content:space-between;gap:12px;height:28px;padding:0 12px;border-top:1px solid var(--kimi-color-border);font-size:11px;color:var(--kimi-color-text-tertiary)}
.uc-stat-r{display:flex;align-items:center;gap:12px}

/* ---------- Responsive ---------- */
@media(max-width:640px){
  .uc-panes{grid-template-columns:1fr}
  .uc-term{border-left:0;border-top:1px solid var(--kimi-color-border)}
  .uc-hide{display:none}
}
</style>
</head>

<script>

      tNotes= document.getElementById('tabNotes');

  function line(html, cls){
    var d = document.createElement('div');
    d.className = 'uc-tl' + (cls ? ' ' + cls : '');
    d.innerHTML = html;
    tb.appendChild(d);
  }

  run.onclick = function(){
    run.disabled = true;
    tb.innerHTML = '';
    tst.textContent = 'running';
    stL.textContent = 'Compiling main.c…';

    setTimeout(function(){
      line('<span class="uc-prompt">$</span> <span class="uc-cmd">gcc main.c -o main &amp;&amp; ./main</span>');
    }, 350);
    setTimeout(function(){ line('Welcome to Ucompiler'); }, 800);
    setTimeout(function(){ line('Made By UditNath Singh'); }, 1150);
    setTimeout(function(){
      var c = document.createElement('div');
      c.className = 'uc-chip';
      c.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M19.3027 5.9053C19.6542 5.55397 20.2247 5.55388 20.5761 5.9053C20.9273 6.25675 20.9273 6.82734 20.5761 7.17874L9.65911 18.0948C9.30773 18.4461 8.73814 18.446 8.38665 18.0948L3.42376 13.1328C3.0726 12.7814 3.07263 12.2118 3.42376 11.8604C3.77524 11.509 4.34575 11.5089 4.6972 11.8604L9.02239 16.1856L19.3027 5.9053Z" fill="currentColor"/></svg> exit code 0 · 0.42s';
      tb.appendChild(c);
      tst.textContent = 'ready';
      stL.textContent = 'Ready · 0 errors · 0.42s';
      run.disabled = false;
    }, 1550);
  };

  tMain.onclick  = function(){ tMain.classList.add('on');  tNotes.classList.remove('on'); };
  tNotes.onclick = function(){ tNotes.classList.add('on'); tMain.classList.remove('on');  };
})();
</script>
</body>
</html>
