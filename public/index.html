<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ucompiler - Interactive C IDE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>

  <!-- Firebase Scripts (v9 compatibility) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <!-- Prism.js Syntax Highlighting -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; }
    .code-font, pre[class*="language-"] {
      font-family: 'JetBrains Mono', monospace !important;
      tab-size: 4 !important; -moz-tab-size: 4 !important;
      text-shadow: none !important;
      border-radius: 0 !important;
      background: transparent !important;
    }
    code[class*="language-"] {
      font-family: 'JetBrains Mono', monospace !important;
      tab-size: 4 !important; -moz-tab-size: 4 !important;
      text-shadow: none !important;
      background: transparent !important;
    }
    textarea:focus { outline: none; }
    .glow-border:focus-within { box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); }
    ::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.8); border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.9); }
    .xterm-viewport { border-radius: 0 0 0.75rem 0.75rem; }
    .xterm-screen { padding: 8px; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    /* Highlighting specific fixes */
    #highlighting-layer, #highlighting-layer * { font-family: 'JetBrains Mono', monospace !important; font-size: inherit; line-height: inherit; }
    #highlighting-layer { margin: 0 !important; padding: 0 !important; }
    #highlighting-content { border: 0 !important; }
    #codeEditor { color: transparent; caret-color: white; /* Make text invisible, keep caret */ }
    #codeEditor::selection { background: rgba(255, 255, 255, 0.2) !important; color: transparent !important; }
.token.comment,
.token.block-comment,
.token.prolog,
.token.doctype,
.token.cdata {
	color: #8b949e;
}

.token.punctuation {
	color: #8b949e;
}

.token.namespace {
	opacity: .7;
}

.token.property,
.token.tag,
.token.boolean,
.token.number,
.token.constant,
.token.symbol,
.token.deleted {
	color: #79c0ff;
}

.token.selector,
.token.attr-name,
.token.string,
.token.char,
.token.builtin,
.token.inserted {
	color: #a5d6ff;
}

.token.operator,
.token.entity,
.token.url,
.language-css .token.string,
.style .token.string {
	color: #d2a8ff;
}

.token.atrule,
.token.attr-value,
.token.keyword {
	color: #ff7b72;
}

.token.function,
.token.class-name {
	color: #d2a8ff;
}

.token.regex,
.token.important,
.token.variable {
	color: #ffa657;
}
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden">
  
  <header class="bg-slate-900/50 backdrop-blur-md border-b border-white/10 flex-shrink-0">
    <div class="max-w-[1920px] w-full mx-auto px-3 md:px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-3 md:gap-0">
      <div class="flex items-center justify-center md:justify-start gap-3 w-full md:w-auto">
        <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-lg flex items-center justify-center shadow-lg">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
          </svg>
        </div>
        <div>
          <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">Ucompiler</h1>
          <p class="text-xs text-slate-400">Interactive Web-Native C IDE</p>
        </div>
      </div>

      <div class="flex items-center gap-2 overflow-x-auto w-full md:w-auto scrollbar-hide shrink-0 pb-1 md:pb-0 justify-start md:justify-end">
        <button id="logoutBtn" class="px-4 py-2 bg-slate-800 text-white font-semibold rounded shadow transition-all text-sm flex items-center gap-2 hover:bg-slate-700 shrink-0 hidden">
          Logout
        </button>
        <button id="authBtn" class="px-4 py-2 bg-white text-slate-900 font-semibold rounded shadow transition-all text-sm flex items-center gap-2 hover:bg-slate-200 shrink-0">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
          </svg>
          <span id="authText">Sign in with Google</span>
        </button>

        <input type="file" id="fileUpload" class="hidden" accept=".c,.cpp,.h,.txt">
        <button id="formatButton" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white rounded shadow transition-all text-sm flex items-center gap-2 shrink-0" title="Format Code (Shift+Alt+F)">
          Format
        </button>
        <button id="uploadButton" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white rounded shadow transition-all text-sm flex items-center gap-2 shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
          Save to Drive
        </button>
        <button id="importDriveButton" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white rounded shadow transition-all text-sm flex items-center gap-2 shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          Import from Drive
        </button>
        <button id="stopButton" class="px-4 py-2 bg-red-600/80 hover:bg-red-600 text-white rounded shadow transition-all text-sm flex items-center gap-2 shrink-0 hidden">
          Stop
        </button>
        <button id="runButton" class="px-6 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 text-white font-semibold rounded shadow transition-all transform hover:scale-105 disabled:opacity-50 flex items-center gap-2 text-sm shrink-0 hidden">
          <span id="buttonText">Run Code</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 w-full flex flex-col md:flex-row min-h-0">
    <div class="w-full md:w-1/2 p-2 md:p-4 flex flex-col flex-1 md:h-full border-b md:border-b-0 md:border-r border-white/10 min-h-0">
      <div class="bg-white/5 backdrop-blur border border-white/10 rounded-t-xl px-4 py-2 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-3 h-3 rounded-full bg-red-500"></div>
          <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
          <div class="w-3 h-3 rounded-full bg-green-500"></div>
          <input type="text" id="fileNameDisplay" value="main.c" class="ml-3 text-sm font-medium text-slate-300 outline-none hover:bg-white/10 px-2 py-0.5 rounded transition-colors cursor-text bg-transparent border-0 min-w-[60px] max-w-[150px] relative z-20 focus:bg-slate-800 focus:text-white" spellcheck="false" title="Click to rename" />
        </div>
      </div>
      <div class="bg-slate-900/50 backdrop-blur border-x border-b border-white/10 rounded-b-xl flex-1 glow-border relative min-h-0 flex overflow-hidden">
        <div id="lineNumbers" class="w-10 md:w-12 bg-slate-950/50 border-r border-slate-700/50 text-right py-3 md:py-4 pr-2 md:pr-3 text-slate-500 font-mono text-[14px] md:text-[15px] leading-relaxed select-none overflow-hidden flex-shrink-0">
          1
        </div>
        <div class="relative flex-1 w-full h-full overflow-hidden bg-transparent">
          <!-- The Syntax Highlighting Layer -->
          <pre id="highlighting-layer" class="absolute inset-0 m-0 w-full h-full bg-transparent p-0 z-0 border-0 outline-none code-font text-[14px] md:text-[15px] leading-relaxed pointer-events-none" aria-hidden="true" style="white-space: pre; overflow: hidden;"><code class="language-c block py-3 md:py-4 px-3 md:px-4" id="highlighting-content"></code></pre>
          <!-- The Invisible Textarea Layer -->
          <textarea id="codeEditor" class="absolute inset-0 m-0 z-10 code-font flex-1 w-full h-full bg-transparent py-3 md:py-4 px-3 md:px-4 resize-none text-[14px] md:text-[15px] leading-relaxed outline-none border-0" spellcheck="false" wrap="off" style="white-space: pre; overflow: auto; color: transparent !important; caret-color: white !important; -webkit-text-fill-color: transparent !important;"></textarea>
        </div>
      </div>
    </div>

    <div class="w-full md:w-1/2 p-2 md:p-4 flex flex-col flex-1 md:h-full min-h-0">
      <div class="bg-white/5 backdrop-blur border border-white/10 rounded-t-xl px-4 py-2 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          <span class="text-sm font-medium text-slate-300">Google Isolated Terminal</span>
        </div>
        <button id="clearButton" class="text-xs text-slate-400 hover:text-white transition-colors p-1">Clear</button>
      </div>
      <div class="bg-[#0D1117] border-x border-b border-white/10 rounded-b-xl flex-1 relative min-h-0 overflow-hidden" id="terminal-container"></div>
    </div>
  </main>

  <!-- Drive Modal -->
  <div id="driveModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50">
    <div class="bg-slate-900 border border-slate-700 p-6 rounded-xl shadow-2xl max-w-lg w-full max-h-[80vh] flex flex-col">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-white flex items-center gap-2">
          <svg class="w-6 h-6 text-blue-500" viewBox="0 0 24 24"><path fill="currentColor" d="M19.1 13.9L13.1 3.5c-.3-.5-1-.5-1.3 0L5.9 13.9c-.3.5-.1 1.2.4 1.5l1.6.9c.5.3 1.2.1 1.5-.4l4.6-8l4.6 8c.3.5 1 .7 1.5.4l1.6-.9c.5-.3.7-1 .4-1.5z"/><path fill="currentColor" d="M12.5 16.5l-4.5-7.8-3 5.2c-.3.5-.1 1.2.4 1.5l6 3.5c.5.3 1.2.1 1.5-.4l1.2-2H12.5z"/><path fill="currentColor" d="M14.6 15l-1.2 2h-6l-1.6.9c-.5.3-1.2.1-1.5-.4L2.8 14l3-5.2 6.5 11.2c.3.5 1 .5 1.3 0l3-5.2h-2z"/></svg>
          Import from Google Drive
        </h2>
        <button id="closeDriveModal" class="text-slate-400 hover:text-white">&times;</button>
      </div>
      <div id="driveFileList" class="flex-1 overflow-y-auto space-y-2 pr-2">
        <!-- Files will be injected here -->
      </div>
      <div id="driveLoading" class="hidden text-center text-slate-400 py-4">
        Loading files...
      </div>
    </div>
  </div>

  <!-- UI Logic -->
  <script src="app.js?v=2"></script>
</body>
</html>
