<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ucompiler - Interactive C IDE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>

  <!-- Firebase Scripts (v9 compatibility) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; }
    .code-font {
      font-family: 'JetBrains Mono', monospace;
      tab-size: 4; -moz-tab-size: 4;
    }
    textarea:focus { outline: none; }
    .glow-border:focus-within { box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); }
    ::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.8); border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.9); }
    .xterm-viewport { border-radius: 0 0 0.75rem 0.75rem; }
    .xterm-screen { padding: 8px; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden">
  
  <header class="bg-slate-900/50 backdrop-blur-md border-b border-white/10 flex-shrink-0">
    <div class="max-w-[1920px] w-full mx-auto px-3 md:px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-3 md:gap-0">
      <div class="flex items-center justify-center md:justify-start gap-3 w-full md:w-auto">
        <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-lg flex items-center justify-center shadow-lg">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
          </svg>
        </div>
        <div>
          <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">Ucompiler</h1>
          <p class="text-xs text-slate-400">Interactive Web-Native C IDE</p>
        </div>
      </div>

      <div class="flex items-center gap-2 overflow-x-auto w-full md:w-auto scrollbar-hide shrink-0 pb-1 md:pb-0 justify-start md:justify-end">
        <button id="authBtn" class="px-4 py-2 bg-white text-slate-900 font-semibold rounded shadow transition-all text-sm flex items-center gap-2 hover:bg-slate-200 shrink-0">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
          </svg>
          <span id="authText">Sign in with Google</span>
        </button>

        <input type="file" id="fileUpload" class="hidden" accept=".c,.cpp,.h,.txt">
        <button id="formatButton" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white rounded shadow transition-all text-sm flex items-center gap-2 shrink-0" title="Format Code (Shift+Alt+F)">
          Format
        </button>
        <button id="uploadButton" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white rounded shadow transition-all text-sm flex items-center gap-2 shrink-0">
          Upload
        </button>
        <button id="downloadButton" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white rounded shadow transition-all text-sm flex items-center gap-2 shrink-0">
          Download
        </button>
        <button id="stopButton" class="px-4 py-2 bg-red-600/80 hover:bg-red-600 text-white rounded shadow transition-all text-sm flex items-center gap-2 shrink-0 hidden">
          Stop
        </button>
        <button id="runButton" class="px-6 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 text-white font-semibold rounded shadow transition-all transform hover:scale-105 disabled:opacity-50 flex items-center gap-2 text-sm shrink-0 hidden">
          <span id="buttonText">Run Code</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 w-full flex flex-col md:flex-row min-h-0">
    <div class="w-full md:w-1/2 p-2 md:p-4 flex flex-col flex-1 md:h-full border-b md:border-b-0 md:border-r border-white/10 min-h-0">
      <div class="bg-white/5 backdrop-blur border border-white/10 rounded-t-xl px-4 py-2 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-3 h-3 rounded-full bg-red-500"></div>
          <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
          <div class="w-3 h-3 rounded-full bg-green-500"></div>
          <span class="ml-3 text-sm font-medium text-slate-300">main.c</span>
        </div>
      </div>
      <div class="bg-slate-900/50 backdrop-blur border-x border-b border-white/10 rounded-b-xl flex-1 glow-border relative min-h-0">
        <textarea id="codeEditor" class="code-font w-full h-full bg-transparent text-slate-100 p-3 md:p-4 resize-none text-[14px] md:text-[15px] leading-relaxed" spellcheck="false"></textarea>
      </div>
    </div>

    <div class="w-full md:w-1/2 p-2 md:p-4 flex flex-col flex-1 md:h-full min-h-0">
      <div class="bg-white/5 backdrop-blur border border-white/10 rounded-t-xl px-4 py-2 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          <span class="text-sm font-medium text-slate-300">Google Isolated Terminal</span>
        </div>
        <button id="clearButton" class="text-xs text-slate-400 hover:text-white transition-colors p-1">Clear</button>
      </div>
      <div class="bg-[#0D1117] border-x border-b border-white/10 rounded-b-xl flex-1 relative min-h-0 overflow-hidden" id="terminal-container"></div>
    </div>
  </main>
  
  <!-- UI Logic -->
  <script src="app.js"></script>
</body>
</html>
